name: A0Notch
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  NotchCore:
    type: framework
    platform: macOS
    sources: [app/Sources/NotchCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: community.agentzero.notch.core
        GENERATE_INFOPLIST_FILE: YES
  A0Notch:
    type: application
    platform: macOS
    sources:
      - path: app/Sources/A0Notch
        excludes: [Resources]
      - path: app/Sources/A0Notch/Resources/Branding
        type: folder
        buildPhase: resources
      - path: app/A0Notch.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: community.agentzero.notch
        PRODUCT_NAME: A0Notch
        # Consume the shared concrete plist; info.path would overwrite it.
        INFOPLIST_FILE: app/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: app/A0Notch.entitlements
    dependencies:
      - target: NotchCore
  NotchCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [app/Tests/NotchCoreTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: community.agentzero.notch.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NotchCore
schemes:
  A0Notch:
    build:
      targets:
        A0Notch: all
        NotchCoreTests: [test]
    test:
      targets: [NotchCoreTests]
